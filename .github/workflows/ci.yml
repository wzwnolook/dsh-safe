name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm test

      - name: Install latest dsh (latest tag)
        run: npm install -g @deepseek-ai/dsh

      - name: Record dsh version
        id: ver
        run: echo "value=$(dsh --version 2>&1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test against latest dsh
        id: smoke-latest
        run: bash tests/smoke-installed.sh

      - name: Write latest badge (always runs)
        if: github.ref == 'refs/heads/main' && matrix.node == '22'
        env:
          VER: ${{ steps.ver.outputs.value }}
          STATUS: ${{ steps.smoke-latest.outcome }}
        run: |
          if [ "$STATUS" = "success" ]; then
            LABEL="verified"; LABEL_COLOR="brightgreen"
          else
            LABEL="dsh latest"; LABEL_COLOR="red"
          fi
          printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"lightgrey","labelColor":"%s"}\n' "$LABEL" "$VER" "$LABEL_COLOR" > .github/verified-dsh-version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/verified-dsh-version.json
          git commit -m "badge: verified dsh $VER [skip ci]" && git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

  smoke-alpha:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install alpha dsh (alpha tag)
        run: npm install -g @deepseek-ai/dsh@alpha

      - name: Record alpha dsh version
        id: alpha-ver
        run: echo "value=$(dsh --version 2>&1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test against alpha dsh
        id: smoke-alpha
        continue-on-error: true
        run: |
          bash tests/smoke-installed.sh

      - name: Write alpha badge (always runs)
        if: github.ref == 'refs/heads/main'
        env:
          VER: ${{ steps.alpha-ver.outputs.value }}
          STATUS: ${{ steps.smoke-alpha.outcome }}
        run: |
          if [ "$STATUS" = "success" ]; then
            LABEL="verified"; LABEL_COLOR="brightgreen"
          else
            LABEL="dsh alpha"; LABEL_COLOR="red"
          fi
          printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"lightgrey","labelColor":"%s"}\n' "$LABEL" "$VER" "$LABEL_COLOR" > .github/verified-dsh-alpha-version.json
          printf '### dsh alpha compatibility\n```\ndsh: %s — smoke passed\n```\n' "$VER" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/verified-dsh-alpha-version.json
          git commit -m "badge: verified dsh alpha $VER [skip ci]" && git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"